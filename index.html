    const btn = document.getElementById('setupMktConfirmBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Đang kiểm tra…'; }
    const res = await checkOrRegisterPin(name, pin, 'marketing');
    if (btn) { btn.disabled = false; btn.textContent = '✔ Xác nhận'; }
    if (!res.ok) { showToast(res.reason || 'Không xác nhận được', 'warn'); return; }
    if (res.registered) showToast('Đã đăng ký PIN cho tên này — nhớ để dùng máy khác', 'ok');
    if (state.pendingAvatar && profilesRef) {
      profilesRef.child(pinKey(name)).set(state.pendingAvatar).catch(() => {});
      state.pendingAvatar = null;
    }
    setMktName(name);
    return;
  }
  if (e.target.closest('#changeMktNameBtn')) {
    forgetMktName();
    return;
  }
  if (e.target.closest('#setupAdminConfirmBtn')) {
    const nameInput = document.getElementById('setupAdminNameInput');
    const pinInput = document.getElementById('setupAdminPinInput');
    const name = nameInput ? nameInput.value.trim() : '';
    const pin = pinInput ? pinInput.value.trim() : '';
    if (!name) { showToast('Nhập tên trước đã', 'warn'); return; }
    if (!pin) { showToast('Đặt mã PIN trước đã (để lần sau dùng lại)', 'warn'); return; }
    const btn = document.getElementById('setupAdminConfirmBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Đang kiểm tra…'; }
    const res = await checkOrRegisterPin(name, pin, 'admin');
    if (btn) { btn.disabled = false; btn.textContent = '✔ Xác nhận'; }
    if (!res.ok) { showToast(res.reason || 'Không xác nhận được', 'warn'); return; }
    if (res.registered) showToast('Đã đăng ký PIN cho tên này — nhớ để dùng máy khác', 'ok');
    if (state.pendingAvatar && profilesRef) {
      profilesRef.child(pinKey(name)).set(state.pendingAvatar).catch(() => {});
      state.pendingAvatar = null;
    }
    setAdminName(name);
    return;
  }
  if (e.target.closest('#changeAdminNameBtn')) {
    forgetAdminName();
    return;
  }
  if (e.target.closest('#notifyToggleBtn')) {
    if (state.notifyEnabled) disableNotifications(); else enableNotifications();
    return;
  }
  const claimBtn = e.target.closest('[data-claim]');
  if (claimBtn) { claim(Number(claimBtn.dataset.claim)); return; }
  const deleteBtn = e.target.closest('[data-delete]');
  if (deleteBtn) {
    const id = Number(deleteBtn.dataset.delete);
    const code = prompt(`Xoá DATA #${String(id).padStart(6,'0')}? Không thể hoàn tác.\nNhập lại mã Quản trị để xác nhận:`);
    if (code === null) return;
    if (code !== ROLE_CODES.admin) {
      showToast('Sai mã Quản trị — huỷ thao tác xoá', 'warn');
      return;
    }
    deleteItem(id);
    return;
  }
  const restoreBtn = e.target.closest('[data-restore-item]');
  if (restoreBtn) { restoreItem(Number(restoreBtn.dataset.restoreItem)); return; }
  const resetPinBtn = e.target.closest('[data-reset-pin]');
  if (resetPinBtn) { resetPin(resetPinBtn.dataset.resetPin); return; }
  const deletePersonBtn = e.target.closest('[data-delete-person]');
  if (deletePersonBtn) { deletePersonPermanently(deletePersonBtn.dataset.deletePerson); return; }
  const chatBtn = e.target.closest('[data-chat]');
  if (chatBtn) {
    const item = findItemById(Number(chatBtn.dataset.chat));
    if (item) openChat(item);
    return;
  }
  const zoomImg = e.target.closest('[data-zoom-item]');
  if (zoomImg) {
    const item = findItemById(Number(zoomImg.dataset.zoomItem));
    if (item && item.qrImage) openLightbox(item.qrImage);
    return;
  }
  const copyBtn = e.target.closest('[data-copy-item]');
  if (copyBtn) {
    const item = findItemById(Number(copyBtn.dataset.copyItem));
    if (item) copyToClipboard(item.name || '');
    return;
  }
  const copyTextBtn = e.target.closest('[data-copy-text]');
  if (copyTextBtn) {
    copyToClipboard(copyTextBtn.dataset.copyText || '');
    return;
  }
  if (e.target.id === 'lightboxOverlay') { closeLightbox(); return; }
  if (e.target.closest('#lightboxCloseBtn')) { closeLightbox(); return; }
  if (e.target.id === 'chatOverlay') { closeChat(); return; }
  if (e.target.closest('#chatCloseBtn')) { closeChat(); return; }
  if (e.target.closest('#chatSendBtn')) { sendChatMessage(); return; }
  if (e.target.closest('#chatImageBtn')) { document.getElementById('chatImageInput').click(); return; }
  if (e.target.closest('#chatCancelImageBtn')) { state.pendingChatImage = null; renderChatModal(); return; }
  const zoomChatMsg = e.target.closest('[data-zoom-chat-msg]');
  if (zoomChatMsg) {
    const mi = Number(zoomChatMsg.dataset.zoomChatMsg);
    const msg = state.chatMessages[mi];
    if (msg && msg.image) openLightbox(msg.image);
    return;
  }
  if (e.target.closest('#resetBtn')) {
    const code = prompt('Đây là hành động xoá TOÀN BỘ dữ liệu, không thể hoàn tác.\nNhập lại mã Quản trị để xác nhận:');
    if (code === null) return;
    if (code !== ROLE_CODES.admin) {
      showToast('Sai mã Quản trị — huỷ thao tác xoá', 'warn');
      return;
    }
    resetAll();
    return;
  }
  if (e.target.closest('#forceReloadAllBtn')) {
    if (!versionRef) { showToast('Cần bật kho dùng chung (Firebase)', 'warn'); return; }
    if (!confirm('Bắt tất cả máy đang mở app tự động tải lại bản mới nhất ngay bây giờ?')) return;
    versionRef.set(Date.now())
      .then(() => showToast('Đã gửi lệnh — mọi người đang mở app sẽ tự tải lại trong giây lát', 'ok'))
      .catch(() => showToast('Gửi lệnh thất bại, kiểm tra mạng', 'warn'));
    return;
  }
  if (e.target.closest('#filterClearBtn')) { clearAdminFilters(); return; }
  if (e.target.closest('#bulkAssignBtn')) { bulkAssignRole(); return; }
  const pagePrev = e.target.closest('[data-page-prev]');
  if (pagePrev) {
    const p = pagePrev.dataset.pagePrev;
    if (p === 'admin') state.adminPage = Math.max(1, state.adminPage - 1);
    if (p === 'mkt') state.mktPage = Math.max(1, state.mktPage - 1);
    if (p === 'sale') state.salePage = Math.max(1, state.salePage - 1);
    renderDynamic();
    return;
  }
  const pageNext = e.target.closest('[data-page-next]');
  if (pageNext) {
    const p = pageNext.dataset.pageNext;
    if (p === 'admin') state.adminPage += 1;
    if (p === 'mkt') state.mktPage += 1;
    if (p === 'sale') state.salePage += 1;
    renderDynamic();
    return;
  }
  if (e.target.closest('[data-sale-day-prev]')) {
    state.saleDayPage = Math.max(1, state.saleDayPage - 1);
    renderDynamic();
    return;
  }
  if (e.target.closest('[data-sale-day-next]')) {
    state.saleDayPage += 1;
    renderDynamic();
    return;
  }
  if (e.target.closest('[data-mkt-day-prev]')) {
    state.mktDayPage = Math.max(1, state.mktDayPage - 1);
    renderDynamic();
    return;
  }
  if (e.target.closest('[data-mkt-day-next]')) {
    state.mktDayPage += 1;
    renderDynamic();
    return;
  }
  const pinMask = e.target.closest('[data-toggle-pin]');
  if (pinMask) { pinMask.classList.toggle('revealed'); return; }
  if (e.target.closest('#mktFilterClearBtn')) {
    ['mktFilterSearch', 'mktFilterFrom', 'mktFilterTo'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    const s = document.getElementById('mktFilterStatus'); if (s) s.value = '';
    state.mktDayPage = 1;
    renderDynamic();
    return;
  }
  if (e.target.closest('#saleFilterClearBtn')) {
    ['saleSearchInput', 'saleFilterFrom', 'saleFilterTo'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    renderDynamic();
    return;
  }
});

document.getElementById('app').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'gateCodeInput') document.getElementById('gateConfirmBtn').click();
  if (e.target.id === 'setupNameInput' || e.target.id === 'setupPinInput') document.getElementById('setupConfirmBtn').click();
  if (e.target.id === 'setupMktNameInput' || e.target.id === 'setupMktPinInput') document.getElementById('setupMktConfirmBtn').click();
  if (e.target.id === 'setupAdminNameInput' || e.target.id === 'setupAdminPinInput') document.getElementById('setupAdminConfirmBtn').click();
  if (e.target.id === 'chatInput') { e.preventDefault(); document.getElementById('chatSendBtn').click(); }
  if (e.target.id === 'groupChatInput') { e.preventDefault(); document.getElementById('groupChatSendBtn').click(); }
});

document.getElementById('app').addEventListener('input', (e) => {
  if (e.target.id === 'saleSearchInput') { state.salePage = 1; renderDynamic(); }
  if (e.target.id === 'filterSearch') { state.adminPage = 1; renderDynamic(); }
  if (e.target.id === 'mktFilterSearch') { state.mktPage = 1; state.mktDayPage = 1; renderDynamic(); }
  if (e.target.id === 'pinsSearchInput') renderDynamic();
});

document.getElementById('app').addEventListener('focusin', (e) => {
  if (e.target.id === 'pinsSearchInput' && !pinsListOpen) {
    pinsListOpen = true;
    renderDynamic();
  }
});

document.getElementById('app').addEventListener('change', (e) => {
  const adminIds = ['filterSentBy', 'filterClaimedBy', 'filterStatus', 'filterFrom', 'filterTo'];
  const mktIds = ['mktFilterStatus', 'mktFilterFrom', 'mktFilterTo'];
  const saleIds = ['saleFilterFrom', 'saleFilterTo'];
  if (adminIds.includes(e.target.id)) { state.adminPage = 1; renderDynamic(); }
  if (mktIds.includes(e.target.id)) { state.mktPage = 1; state.mktDayPage = 1; renderDynamic(); }
  if (saleIds.includes(e.target.id)) { state.salePage = 1; renderDynamic(); }
  if (e.target.dataset && e.target.dataset.pageSize) {
    const p = e.target.dataset.pageSize;
    const size = Number(e.target.value) || 25;
    if (p === 'admin') { state.adminPageSize = size; state.adminPage = 1; }
    if (p === 'mkt') { state.mktPageSize = size; state.mktPage = 1; }
    if (p === 'sale') { state.salePageSize = size; state.salePage = 1; }
    renderDynamic();
  }
  if (e.target.id === 'saleDaysPerPageSelect') {
    state.saleDaysPerPage = Number(e.target.value) || 3;
    state.saleDayPage = 1;
    renderDynamic();
  }
  if (e.target.id === 'mktDaysPerPageSelect') {
    state.mktDaysPerPage = Number(e.target.value) || 3;
    state.mktDayPage = 1;
    renderDynamic();
  }
  if (e.target.id === 'pinsSortSelect') {
    state.pinsSortMode = e.target.value;
    renderDynamic();
  }
  if (e.target.dataset && e.target.dataset.changeRole) {
    changePersonRole(e.target.dataset.changeRole, e.target.value);
  }
});

document.getElementById('fileInput').addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) handleImageFile(e.target.files[0]);
  e.target.value = '';
});

document.getElementById('avatarFileInput').addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) handleAvatarFile(e.target.files[0]);
  e.target.value = '';
});

document.getElementById('chatImageInput').addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) stageChatImage(e.target.files[0]);
  e.target.value = '';
});

document.getElementById('groupChatImageInput').addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) stageGroupChatImage(e.target.files[0]);
  e.target.value = '';
});

document.addEventListener('paste', (e) => {
  const items = (e.clipboardData || window.clipboardData).items;
  if (state.groupChatOpen) {
    for (const it of items) {
      if (it.type.indexOf('image') !== -1) {
        stageGroupChatImage(it.getAsFile());
        e.preventDefault();
        break;
      }
    }
    return;
  }
  if (state.chatItem) {
    for (const it of items) {
      if (it.type.indexOf('image') !== -1) {
        stageChatImage(it.getAsFile());
        e.preventDefault();
        break;
      }
    }
    return;
  }
  if (state.role !== 'marketing') return;
  for (const it of items) {
    if (it.type.indexOf('image') !== -1) {
      handleImageFile(it.getAsFile());
      e.preventDefault();
      break;
    }
  }
});

function initMidAutumnTheme() {
  const icons = ['🏮', '🌕', '🐰', '🥮', '✨', '🎑', '⭐'];
  const bg = document.getElementById('trungThuBg');
  if (bg) {
    let html = '';
    for (let i = 0; i < 12; i++) {
      const icon = icons[Math.floor(Math.random() * icons.length)];
      const top = Math.random() * 88;
      const left = Math.random() * 88;
      const size = 80 + Math.random() * 70; // to hơn hẳn (80–150px) cho nổi bật, tràn năng lượng
      const delay = Math.random() * 6;
      const dur = 10 + Math.random() * 10; // 10–20s, mỗi cái 1 tốc độ khác nhau
      const dx = (Math.random() * 180 - 90).toFixed(0) + 'px'; // trôi ngang ngẫu nhiên -90..90px
      const dy = (Math.random() * 180 - 90).toFixed(0) + 'px'; // trôi dọc ngẫu nhiên -90..90px
      const rot = (Math.random() * 40 - 20).toFixed(0) + 'deg';
      html += `<span style="top:${top}%;left:${left}%;font-size:${size}px;animation-delay:${delay}s;animation-duration:${dur}s;--dx:${dx};--dy:${dy};--rot:${rot};">${icon}</span>`;
    }
    bg.innerHTML = html;
  }

  const slogans = [
    '🏮 Trung Thu đoàn viên — data đầy khoang, đơn đầy tay!',
    '🌕 Trăng tròn đầy, doanh số cũng đầy — chốt đơn lẹ tay nào!',
    '🥮 Bánh Trung Thu ngọt, mà doanh số còn ngọt hơn!',
    '🐰 Thỏ ngọc rước đèn, cả team rước đơn về nhà!',
    '✨ Trung Thu an lành — đơn hàng rộn ràng cả tháng!',
    '🎑 Đèn lồng thắp sáng phố, nhiệt huyết thắp sáng team mình!',
    '🌕 Một mùa trăng tròn, trăm mùa chốt đơn thành công!',
    '🏮 Trung Thu vui trọn vẹn, KPI cũng trọn vẹn nốt nha!'
  ];
  const banner = document.getElementById('ttBanner');
  if (banner) {
    let idx = -1;
    const pick = () => {
      let n; do { n = Math.floor(Math.random() * slogans.length); } while (n === idx && slogans.length > 1);
      idx = n;
      banner.style.animation = 'none';
      void banner.offsetWidth;
      banner.style.animation = '';
      banner.textContent = slogans[idx];
    };
    pick();
    setInterval(pick, 8000);
  }
}
initMidAutumnTheme();

renderApp();
attachReadsSyncForCurrentUser();
if (!dbRef) {
  loadPool().then(p => {
    state.pool = p;
    lastPoolSerialized = JSON.stringify(p);
    if (state.lockedRole) renderDynamic();
  });
}

let knownAppVersion = null;
if (versionRef) {
  versionRef.on('value', (snap) => {
    const v = snap.val();
    if (knownAppVersion === null) { knownAppVersion = v; return; } // lần đọc đầu — chỉ ghi nhớ, không tải lại
    if (v && v !== knownAppVersion) {
      const url = new URL(window.location.href);
      url.searchParams.set('v', v);
      window.location.href = url.toString();
    }
  });
}

(function generateAppIcon() {
  try {
    const size = 180;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const r = 34;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.arcTo(size, 0, size, size, r);
    ctx.arcTo(size, size, 0, size, r);
    ctx.arcTo(0, size, 0, 0, r);
    ctx.arcTo(0, 0, size, 0, r);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#FF6B81');
    grad.addColorStop(1, '#B0203A');
    ctx.fillStyle = grad;
    ctx.fill();

    const cx = size / 2;
    const cy = size * 0.53;
    const w = size * 0.62;
    const topY = cy - w * 0.32;
    ctx.beginPath();
    ctx.moveTo(cx, topY + w * 0.3);
    ctx.bezierCurveTo(cx, topY, cx - w / 2, topY, cx - w / 2, topY + w * 0.3);
    ctx.bezierCurveTo(cx - w / 2, topY + (w + w * 0.3) / 2, cx, topY + (w + w * 0.3) / 2, cx, topY + w);
    ctx.bezierCurveTo(cx, topY + (w + w * 0.3) / 2, cx + w / 2, topY + (w + w * 0.3) / 2, cx + w / 2, topY + w * 0.3);
    ctx.bezierCurveTo(cx + w / 2, topY, cx, topY, cx, topY + w * 0.3);
    ctx.closePath();
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();

    const dataUrl = canvas.toDataURL('image/png');
    const appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon';
    appleIcon.href = dataUrl;
    document.head.appendChild(appleIcon);
    const favicon = document.createElement('link');
    favicon.rel = 'icon';
    favicon.href = dataUrl;
    document.head.appendChild(favicon);
  } catch (e) {}
})();
</script>
