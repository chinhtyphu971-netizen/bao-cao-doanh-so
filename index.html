<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
<title>Kho data thả tim</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kho data thả tim" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1B0F12" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; width: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:
      radial-gradient(700px circle at 85% 5%, rgba(255,205,90,0.38), transparent 62%),
      radial-gradient(650px circle at 8% 12%, rgba(255,110,50,0.26), transparent 60%),
      radial-gradient(600px circle at 12% 96%, rgba(255,150,40,0.22), transparent 60%),
      radial-gradient(600px circle at 92% 92%, rgba(210,40,30,0.24), transparent 60%),
      linear-gradient(180deg, #1B0F12 0%, #2A1310 40%, #1E0D0F 75%, #120809 100%);
    background-attachment: fixed;
    color: #EAF0FF;
    min-height: 100vh;
  }
  .app { padding: max(20px, env(safe-area-inset-top)) 20px 20px; display: flex; flex-direction: column; gap: 16px; max-width: 1100px; width: 100%; margin: 0 auto; box-sizing: border-box; position: relative; z-index: 1; }
  /* ---- Trung Thu: lớp nền mờ trang trí (không ảnh hưởng thao tác) ---- */
  #trungThuBg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  #trungThuBg span { position: absolute; opacity: 0.13; filter: blur(0.5px); animation: ttFloat ease-in-out infinite; }
  @keyframes ttFloat {
    0%   { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(var(--dx, 30px), var(--dy, -30px)) rotate(var(--rot, 12deg)); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .tt-banner {
    display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
    background: linear-gradient(90deg, rgba(255,163,26,0.16), rgba(255,90,60,0.10));
    border: 1px solid rgba(255,163,26,0.35);
    color: #FFC978; font-size: 12.5px; font-weight: 600;
    padding: 6px 14px; border-radius: 999px;
    animation: ttFade 0.6s ease;
  }
  @keyframes ttFade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { font-size: 28px; }
  .brand-title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .brand-sub { font-size: 12.5px; color: #7C89A6; margin-top: 2px; }
  .roles { display: flex; gap: 6px; background: #131C31; padding: 4px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); }
  .role-btn { background: transparent; border: none; color: #7C89A6; padding: 7px 14px; border-radius: 7px; font-size: 13.5px; cursor: pointer; font-weight: 500; }
  .role-btn.active { background: #1F2C4A; color: #EAF0FF; }
  .locked-tag { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #7C89A6; background: #131C31; padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); }
  .locked-tag b { color: #EAF0FF; }
  .locked-tag button { background: none; border: none; color: #FF8A93; text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0; }
  .panel { background: #111A2E; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 20px 22px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .panel-head h2 { font-size: 16px; font-weight: 650; margin: 0; }
  .pill { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #FFC93C; background: rgba(255,201,60,0.1); padding: 5px 10px; border-radius: 999px; }
  .sync-banner { background: #0D1526; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .sync-banner.on { border-color: rgba(53,208,127,0.35); }
  .sync-banner.off { border-color: rgba(255,201,60,0.35); }
  .sync-status b { display: block; margin-bottom: 4px; font-size: 13.5px; }
  .sync-status.on b { color: #35D07F; }
  .sync-status.off b { color: #FFC93C; }
  .sync-status p { margin: 0; font-size: 12.5px; color: #7C89A6; line-height: 1.6; }
  .sync-status ol { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: #7C89A6; line-height: 1.9; }
  .sync-status a { color: #7fb8ff; }
  .form-grid { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; align-items: flex-start; }
  .drop-zone {
    width: 160px; height: 160px; border: 2px dashed rgba(255,255,255,0.16); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
    background: #0D1526; cursor: pointer; text-align: center; padding: 10px; color: #7C89A6; font-size: 12px;
    flex-shrink: 0; position: relative; overflow: hidden; caret-color: transparent; outline: none; -webkit-user-select: text; user-select: text;
  }
  .drop-zone.has-image { border-style: solid; border-color: rgba(53,208,127,0.4); }
  .drop-zone img { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; border-radius: 10px; }
  .drop-zone .hint-icon { font-size: 22px; }
  .choose-file-link { background: none; border: none; color: #FF8A93; font-size: 11.5px; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 2px; }
  .drop-zone .clear-img {
    position: absolute; top: 4px; right: 4px; background: rgba(11,18,32,0.85); border: none;
    color: #fff; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 12px; z-index: 2;
  }
  .form-fields { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 220px; }
  .input { background: #0D1526; border: 1px solid rgba(255,255,255,0.09); color: #EAF0FF; padding: 10px 12px; border-radius: 9px; font-size: 13.5px; width: 100%; }
  .input:focus { outline: none; border-color: #FF4757; }
  .btn { display: flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 9px; font-size: 13.5px; font-weight: 600; cursor: pointer; border: none; }
  .btn.primary { background: #FF4757; color: #fff; align-self: flex-start; }
  .btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.14); color: #EAF0FF; }
  .select { background: #0D1526; border: 1px solid rgba(255,255,255,0.09); color: #EAF0FF; padding: 8px 10px; border-radius: 9px; font-size: 13px; }
  .sub-head { font-size: 13px; color: #7C89A6; margin: 18px 0 8px; font-weight: 600; }
  .log-list, .locked-list { display: flex; flex-direction: column; gap: 6px; }
  .log-row, .locked-row { display: flex; align-items: center; gap: 12px; font-size: 13px; background: #0D1526; padding: 9px 12px; border-radius: 8px; }
  .locked-row { color: #7C89A6; }
  .locked-by b { color: #EAF0FF; }
  .ticket { font-family: 'SFMono-Regular', Consolas, monospace; color: #7C89A6; font-size: 12.5px; min-width: 78px; }
  .log-name { flex: 1; }
  .status { display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .status.pending { color: #FFC93C; }
  .status.locked { color: #35D07F; }
  .log-time { color: #556; font-size: 12px; min-width: 62px; text-align: right; }

  /* ---- Log-row (MKT): căn cột cố định để bảng thẳng hàng dù có/không có ảnh QR ---- */
  .log-row {
    display: grid;
    grid-template-columns: 34px minmax(0,1fr) 200px 68px;
    gap: 14px;
    align-items: center;
    transition: background 0.12s ease;
  }
  .log-row:hover { background: #101B32; }
  .log-thumb {
    width: 34px; height: 34px; border-radius: 7px; object-fit: cover; flex-shrink: 0;
    background: #0A1120; display: flex; align-items: center; justify-content: center;
    color: #3A4560; font-size: 14px; border: 1px solid rgba(255,255,255,0.05);
  }
  .log-main { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .log-name-cell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .log-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
  .log-row .status { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-row .chat-btn { padding: 6px 8px; font-size: 11.5px; white-space: nowrap; flex-shrink: 0; }
  .mkt-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .mkt-stat { flex: 1; min-width: 120px; background: #0D1526; border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 10px 14px; }
  .mkt-stat .n { font-size: 19px; font-weight: 700; line-height: 1.2; }
  .mkt-stat .l { font-size: 11.5px; color: #7C89A6; margin-top: 2px; }
  @media (max-width: 640px) {
    .log-row {
      grid-template-columns: 30px minmax(0,1fr);
      grid-template-areas: "thumb main" "thumb meta" "thumb time";
      row-gap: 5px;
    }
    .log-thumb { grid-area: thumb; }
    .log-main { grid-area: main; }
    .log-meta { grid-area: meta; }
    .log-time { grid-area: time; text-align: left; min-width: 0; }
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { background: #0D1526; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .card.pulse { animation: pulse 1.6s ease-in-out 2; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,71,87,0); } 50% { box-shadow: 0 0 0 4px rgba(255,71,87,0.18); } }
  .card-top { display: flex; justify-content: space-between; align-items: center; }
  .time { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: #556; }
  .card-body { display: flex; gap: 12px; align-items: center; }
  .card-qr { width: 92px; height: 92px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #0A1120; }
  .card-name { font-size: 14.5px; font-weight: 600; }
  .card-note { font-size: 12px; color: #7C89A6; margin-top: 2px; }
  .heart-btn { display: flex; align-items: center; justify-content: center; gap: 7px; background: #FF4757; color: #fff; border: none; padding: 10px; border-radius: 9px; font-size: 13.5px; font-weight: 650; cursor: pointer; width: 100%; }
  .heart-btn:hover { background: #ff5c6c; }
  .table { display: flex; flex-direction: column; gap: 2px; overflow-x: auto; }
  .table-head, .table-row { display: grid; grid-template-columns: 40px 60px 100px 1.1fr 1.2fr 100px 110px 100px 90px 90px 68px; gap: 10px; padding: 9px 10px; font-size: 12.5px; align-items: center; min-width: 870px; }
  .row-delete-btn { background: rgba(255,71,87,0.12); border: 1px solid rgba(255,71,87,0.3); color: #FF8A93; width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 12px; line-height: 1; }
  .row-delete-btn:hover { background: rgba(255,71,87,0.25); }
  .table-head { color: #556; font-size: 11.5px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .table-row { background: #0D1526; border-radius: 8px; }
  .table-thumb { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; background: #0A1120; }
  .cell-ellipsis { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-copy-wrap { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .cell-copy-wrap .cell-ellipsis { flex: 1; }
  .cell-copy-wrap .copy-btn { flex-shrink: 0; padding: 2px 4px; font-size: 12px; opacity: 0.7; }
  .cell-copy-wrap .copy-btn:hover { opacity: 1; }
  .muted { color: #7C89A6; }
  .empty { color: #556; font-size: 13.5px; padding: 30px 0; text-align: center; }
  .empty.small { padding: 10px 0; text-align: left; }
  .toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: #1F2C4A; border: 1px solid rgba(255,255,255,0.1); padding: 10px 16px; border-radius: 9px; font-size: 13px; z-index: 50; display: none; max-width: 90vw; text-align: center; }
  .toast.show { display: block; }
  .toast.ok { border-color: rgba(53,208,127,0.4); color: #35D07F; }
  .toast.warn { border-color: rgba(255,71,87,0.4); color: #FF8A93; }
  .foot { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #556; margin-top: 4px; }
  .gate-wrap { display: flex; justify-content: center; padding: 40px 10px; }
  .gate-card { background: #111A2E; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 28px; max-width: 380px; width: 100%; text-align: center; }
  .gate-card h2 { margin: 0 0 4px; font-size: 17px; }
  .gate-card p { color: #7C89A6; font-size: 13px; margin: 0 0 18px; }
  .gate-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
  .gate-role-btn { background: #0D1526; border: 1px solid rgba(255,255,255,0.09); color: #EAF0FF; padding: 12px; border-radius: 10px; font-size: 14px; cursor: pointer; text-align: left; padding-left: 16px; }
  .gate-role-btn:hover { border-color: #FF4757; }
  .gate-code-row { display: flex; gap: 8px; margin-top: 10px; }
  .gate-back { margin-top: 12px; background: none; border: none; color: #7C89A6; text-decoration: underline; cursor: pointer; font-size: 12px; }
  .gate-error { color: #FF8A93; font-size: 12.5px; margin-top: 8px; }

  /* ---- Tối ưu cho điện thoại ---- */
  @media (max-width: 640px) {
    .app { padding-left: 14px; padding-right: 14px; gap: 12px; }
    .topbar { gap: 8px; }
    .brand-title { font-size: 17px; }
    .brand-sub { font-size: 11.5px; }
    .roles, .locked-tag { width: 100%; justify-content: center; }
    #navSlot { width: 100%; }
    .topbar > div:last-child { width: 100%; }
    .panel { padding: 16px 14px; border-radius: 14px; }
    .btn, .btn.small, .chat-btn, .zalo-btn, .copy-btn, .row-delete-btn, .role-btn {
      min-height: 40px;
    }
    .copy-btn, .row-delete-btn { min-width: 36px; }
    .heart-btn { min-height: 46px; font-size: 14.5px; }
    .form-grid { flex-direction: column; align-items: stretch; }
    .form-fields { min-width: 0; }
    .filter-row { flex-direction: column; align-items: stretch; }
    .filter-row .select, .filter-row .input { max-width: none !important; width: 100%; }
    .drop-zone { width: 100%; height: 140px; }
    .grid { grid-template-columns: 1fr; }
    .table-row { padding: 12px 10px; }
    .chat-modal { max-width: 100%; }
  }

  .chat-btn { background: rgba(127,184,255,0.12); border: 1px solid rgba(127,184,255,0.35); color: #7fb8ff; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; cursor: pointer; font-weight: 600; position: relative; }
  .chat-btn.has-unread { border-color: rgba(255,71,87,0.5); animation: pulse 1.6s ease-in-out infinite; }
  .chat-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 4px; background: #FF4757; color: #fff; border-radius: 999px; font-size: 10px; font-weight: 700; margin-left: 6px; }
  .chat-btn:hover { background: rgba(127,184,255,0.22); }
  .chat-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 100; padding: 0; }
  .group-chat-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 100; display: flex; align-items: flex-end; justify-content: flex-end; padding: 16px; }
  .group-chat-overlay .chat-modal { pointer-events: auto; width: 320px; max-width: calc(100vw - 32px); height: 440px; max-height: 70dvh; border-radius: 16px; box-shadow: 0 12px 32px rgba(0,0,0,0.4); }
  @media (max-width: 480px) { .group-chat-overlay { padding: 10px; } .group-chat-overlay .chat-modal { width: calc(100vw - 20px); } }
  .chat-modal { background: #111A2E; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px 16px 0 0; width: 100%; max-width: 420px; height: 70dvh; max-height: 70dvh; display: flex; flex-direction: column; overflow: hidden; }
  .chat-header { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-shrink: 0; }
  .chat-header .title { font-size: 14px; font-weight: 650; }
  .chat-header .sub { font-size: 12px; color: #7C89A6; margin-top: 3px; }
  .chat-close { background: none; border: none; color: #7C89A6; cursor: pointer; font-size: 16px; line-height: 1; flex-shrink: 0; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .chat-msg { max-width: 78%; padding: 8px 11px; border-radius: 10px; font-size: 13px; line-height: 1.4; }
  .chat-msg.mine { align-self: flex-end; background: #FF4757; color: #fff; border-bottom-right-radius: 3px; }
  .chat-msg.theirs { align-self: flex-start; background: #0D1526; color: #EAF0FF; border-bottom-left-radius: 3px; }
  .chat-msg .who { font-size: 10.5px; opacity: 0.75; margin-bottom: 2px; }
  .chat-input-row { display: flex; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
  .chat-input-row input { flex: 1; min-width: 0; }
  .chat-input-row button { flex-shrink: 0; }
  .card-qr { cursor: zoom-in; }
  .lightbox-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 110; padding: 20px; }
  .lightbox-img { max-width: 92vw; max-height: 82vh; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  .lightbox-close { position: absolute; top: 18px; right: 22px; background: rgba(255,255,255,0.12); border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .zalo-btn { display: flex; align-items: center; justify-content: center; gap: 6px; background: #0068FF; color: #fff; border: none; padding: 9px; border-radius: 8px; font-size: 12.5px; font-weight: 650; cursor: pointer; text-decoration: none; margin-top: 6px; }
  .zalo-btn:hover { background: #1a7bff; }
  .copy-btn { background: none; border: none; color: #7C89A6; cursor: pointer; font-size: 12px; padding: 2px 4px; flex-shrink: 0; }
  .copy-btn:hover { color: #EAF0FF; }
  .pin-mask { cursor: pointer; user-select: none; }
  .pin-mask .pin-real { display: none; }
  .pin-mask:hover .pin-real, .pin-mask.revealed .pin-real { display: inline; }
  .pin-mask:hover .pin-dots, .pin-mask.revealed .pin-dots { display: none; }
  .mine-compact { display: flex; align-items: center; gap: 12px; background: #0D1526; border: 1px solid rgba(53,208,127,0.3); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .mine-compact .card-qr-sm { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #0A1120; cursor: zoom-in; }
  .mine-compact .mc-info { flex: 1; min-width: 0; }
  .mine-compact .mc-name { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; min-width: 0; }
  .mine-compact .mc-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .mine-compact .mc-name .ticket, .mine-compact .mc-name .copy-btn { flex-shrink: 0; }
  .mine-compact .mc-sub { font-size: 11.5px; color: #7C89A6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mine-compact .mc-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .mine-compact .zalo-btn { margin-top: 0; padding: 6px 8px; font-size: 11.5px; }
  .mine-compact .chat-btn { padding: 6px 9px; font-size: 11.5px; white-space: nowrap; }
  .mine-compact .ticket { font-size: 11px; }
</style>
</head>
<body>
<div id="trungThuBg"></div>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🏮</span>
      <div>
        <div class="brand-title">Kho data thả tim</div>
        <div class="brand-sub">Ai bấm ❤️ trước, người đó nhận — data tự khóa ngay sau đó</div>
        <div class="tt-banner" id="ttBanner"></div>
      </div>

function pinKey(name) {
  // Firebase keys can't contain . # $ [ ] / — strip those just in case.
  return name.trim().toLowerCase().replace(/[.#$\[\]\/]/g, '');
}

async function checkOrRegisterPin(name, pin, role) {
  if (!pinsRef) return { ok: true }; // no shared store configured, skip PIN check
  const key = pinKey(name);
  if (!key) return { ok: false, reason: 'Tên không hợp lệ' };
  try {
    const snap = await pinsRef.child(key).once('value');
    const existing = snap.val();
    if (existing === null) {
      // First time this name is used — register this PIN + role + timestamp for it.
      await pinsRef.child(key).set({ pin, role: role || '', registeredAt: Date.now() });
      return { ok: true, registered: true };
    }
    const existingPin = (existing && typeof existing === 'object') ? existing.pin : existing;
    if (existingPin === pin) return { ok: true };
    return { ok: false, reason: 'Sai mã PIN cho tên này' };
  } catch (e) {
    return { ok: false, reason: 'Không kiểm tra được PIN, kiểm tra mạng rồi thử lại' };
  }
}

function defaultPool() { return { nextId: 128, items: [] }; }

function normalizePool(pool) {
  if (!pool || typeof pool !== 'object') return defaultPool();
  return {
    nextId: typeof pool.nextId === 'number' ? pool.nextId : defaultPool().nextId,
    items: Array.isArray(pool.items) ? pool.items : [],
  };
}

// Ai đã nhận data nào được lưu ở 1 nhánh Firebase riêng ("claims"), được Rules
// bảo vệ để chỉ ghi được đúng 1 lần — dù máy nào chạy code cũ vẫn không lách qua được.
let rawPool = defaultPool();
let allClaims = {};

function mergePoolWithClaims(pool, claims) {
  const items = (pool.items || []).map(it => {
    const c = claims[it.id];
    if (c) return { ...it, claimedBy: c.claimedBy || null, claimedAt: c.claimedAt || null };
    return it; // Data cũ (trước khi có nhánh "claims" riêng) — giữ nguyên claimedBy sẵn có.
  });
  return { nextId: pool.nextId, items };
}

function recomputeMergedPool() {
  const merged = mergePoolWithClaims(rawPool, allClaims);
  const serialized = JSON.stringify(merged);
  if (serialized !== lastPoolSerialized) {
    state.pool = merged;
    lastPoolSerialized = serialized;
    saveLocalCache(merged);
    checkForNewItems(merged);
    if (state.lockedRole) renderDynamic();
  }
}

function safeGet(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }
function safeSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

function loadLocalCache() {
  try {
    const raw = localStorage.getItem(LOCAL_POOL_CACHE_KEY);
    if (raw) return normalizePool(JSON.parse(raw));
  } catch (e) {}
  return defaultPool();
}
function saveLocalCache(pool) {
  try { localStorage.setItem(LOCAL_POOL_CACHE_KEY, JSON.stringify(pool)); } catch (e) {}
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const time = d.toLocaleTimeString('vi-VN', { hour12: false });
  return `${day}/${month} ${time}`;
}

function escAttr(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// Rút gọn hiển thị cho các ô dài (đặc biệt link Facebook) trong bảng admin:
// - Nếu là link: hiện dạng rút gọn kèm icon 🔗, click để mở tab mới, hover xem đầy đủ.
// - Nếu là chữ thường: cắt 1 dòng bằng CSS ellipsis, hover xem đầy đủ qua title.
function tableCell(text, extraClass) {
  const cls = extraClass ? ` ${extraClass}` : '';
  const raw = text || '';
  if (!raw) return `<span class="cell-ellipsis muted">—</span>`;
  const isLong = raw.length > 24 || /^https?:\/\//i.test(raw.trim());
  if (!isLong) {
    // Text ngắn (sđt, tên...) — hiện y như cũ, không rút gọn không nút copy để khỏi choán chỗ.
    return `<span class="${extraClass || ''}">${raw}</span>`;
  }
  // Chỉ link/text dài mới rút gọn 1 dòng + nút copy.
  return `<div class="cell-copy-wrap">
    <span class="cell-ellipsis${cls}" title="${escAttr(raw)}">${raw}</span>
    <button class="copy-btn" data-copy-text="${escAttr(raw)}" title="Copy">📋</button>
  </div>`;
}

function formatDateTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const datePart = d.toLocaleDateString('vi-VN');
  const timePart = d.toLocaleTimeString('vi-VN', { hour12: false });
  return `${datePart} ${timePart}`;
}

function resizeImage(dataUrl, maxDim, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

function resizeAvatarSquare(dataUrl, size) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2;
      const sy = (img.height - side) / 2;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      resolve(canvas.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    o.start();
    o.stop(ctx.currentTime + 0.36);
  } catch (e) {}
}

    const body = newItems.length === 1
      ? `${first.name} vừa được gửi vào kho`
      : `${newItems.length} data mới vừa được gửi vào kho`;
    try {
      const n = new Notification('❤️ Có data mới!', { body });
      n.onclick = () => { window.focus(); n.close(); };
    } catch (e) {}
  } else {
    showToast(newItems.length === 1 ? `📡 Data mới: ${newItems[0].name}` : `📡 Có ${newItems.length} data mới`, 'ok');
  }
}

let knownPendingIds = null;
function checkForNewItems(pool) {

  const idSet = new Set(pendingIds.map(it => it.id));

    knownPendingIds = idSet;
    return;
  }
  const fresh = pendingIds.filter(it => !knownPendingIds.has(it.id));
  knownPendingIds = idSet;
  if (fresh.length && state.role === 'sale') notifyNewItems(fresh);
}

function decodeQrLink(dataUrl) {
  return new Promise((resolve) => {
    if (typeof jsQR === 'undefined') { resolve(null); return; }
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const result = jsQR(imageData.data, canvas.width, canvas.height);
        if (!result || !result.data) { resolve(null); return; }
        const text = result.data.trim();
        if (/^https?:\/\//i.test(text)) { resolve(text); return; }
        const digits = text.replace(/\D/g, '');
        if (digits.length >= 9 && digits.length <= 12) { resolve(`https://zalo.me/${digits}`); return; }
        resolve(null);
      } catch (e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

async function handleImageFile(file) {

    state.pendingImage = resized;

    state.pendingZaloLink = link;
    if (link) showToast('Đã đọc được link Zalo từ ảnh QR', 'ok');
  };
  reader.readAsDataURL(file);
}

    }
  };
  reader.readAsDataURL(file);
}

async function addItem() {
  const nameInput = document.getElementById('nameInput');
  const noteInput = document.getElementById('noteInput');
  const name = nameInput ? nameInput.value : '';
  const note = noteInput ? noteInput.value : '';
  if (!name.trim()) { showToast('Nhập tên khách trước đã', 'warn'); return; }

  const sendBtn = document.getElementById('sendBtn');
  if (sendBtn && sendBtn.disabled) return; // đang xử lý lần gửi trước — chặn bấm chồng lên nhau
  if (sendBtn) sendBtn.disabled = true;

  const nameValCheck = name.trim().toLowerCase();
  const todayStrCheck = new Date().toDateString();
  const dupItem = (state.pool.items || []).find(it =>
    it.sentBy === state.mktName &&
    (it.name || '').trim().toLowerCase() === nameValCheck &&
    it.createdAt && new Date(it.createdAt).toDateString() === todayStrCheck
  );
  if (dupItem) {
    const ok = confirm(`Bạn đã gửi khách "${dupItem.name}" rồi lúc ${formatTime(dupItem.createdAt)} hôm nay (#${String(dupItem.id).padStart(6,'0')}).\nVẫn muốn gửi tiếp lần nữa?`);
    if (!ok) { if (sendBtn) sendBtn.disabled = false; return; }
  }

  const qrImage = state.pendingImage || null;
  const zaloLink = state.pendingZaloLink || null;
  const sentBy = state.mktName || '';
  const nameVal = name.trim();
  const noteVal = note.trim();

  let newItem = null;
  let saveOk = true;

  if (dbRef) {
    // Dùng transaction để cấp mã số (id) an toàn tuyệt đối — 2 Marketing gửi
    // cùng lúc sẽ không bao giờ bị trùng mã, vì Firebase tự tuần tự hoá việc này.
    try {
      const result = await dbRef.transaction((pool) => {
        const base = (pool && Array.isArray(pool.items)) ? pool : defaultPool();
        const id = typeof base.nextId === 'number' ? base.nextId : defaultPool().nextId;
        const item = {
          id, name: nameVal, note: noteVal, createdAt: Date.now(),
          claimedBy: null, claimedAt: null, qrImage, sentBy, zaloLink,
        };
        return { nextId: id + 1, items: [item, ...base.items] };
      });
      const val = result && result.snapshot ? result.snapshot.val() : null;
      const pool = normalizePool(val);
      state.pool = pool;
      lastPoolSerialized = JSON.stringify(pool);
      saveLocalCache(pool);
      newItem = pool.items[0];
      remoteWarned = false;
    } catch (e) {
      saveOk = false;
      if (!remoteWarned) {
        showToast('Chưa lưu được lên kho dùng chung — kiểm tra mạng rồi thử lại', 'warn');
        remoteWarned = true;
      }
    }
  } else {
    const current = await loadPool();
    const id = current.nextId;
    newItem = {
      id, name: nameVal, note: noteVal, createdAt: Date.now(),
      claimedBy: null, claimedAt: null, qrImage, sentBy, zaloLink,
    };
    const nextLocal = { nextId: id + 1, items: [newItem, ...current.items] };
    saveOk = await savePool(nextLocal);
    if (saveOk) {
      state.pool = nextLocal;
      lastPoolSerialized = JSON.stringify(nextLocal);
    }
  }

  if (sendBtn) sendBtn.disabled = false;
  if (!saveOk || !newItem) return;

  state.pendingImage = null;
  state.pendingZaloLink = null;
  if (nameInput) nameInput.value = '';
  if (noteInput) noteInput.value = '';
  renderDropZone();
  renderDynamic();
  syncToSheet(newItem);
  showToast(`Đã gửi DATA #${String(newItem.id).padStart(6,'0')}`, 'ok');
}

async function claim(id) {
  if (!state.saleName) { showToast('Chọn tên Sale trước khi bấm ❤️', 'warn'); return; }
  const myName = state.saleName;

  if (dbRef && claimsRef) {
    const todayStr = new Date().toDateString();
    const claimedTodayCount = (state.pool.items || []).filter(it =>
      it.claimedBy === myName && it.claimedAt && new Date(it.claimedAt).toDateString() === todayStr
    ).length;
    if (claimedTodayCount >= DAILY_CLAIM_LIMIT) {
      showToast(`Bạn đã nhận đủ ${DAILY_CLAIM_LIMIT} data hôm nay — không thể nhận thêm, thử lại vào ngày mai nhé.`, 'warn');
      return;
    }
    const claimedAt = Date.now();
    try {
      // Ghi thẳng vào nhánh "claims" — Firebase Rules chỉ cho ghi nếu ô này CHƯA từng
      // có ai nhận (xem hướng dẫn Rules). Máy nào chạy code cũ cũng không lách được,
      // vì server tự chặn, không phụ thuộc vào việc client có kiểm tra đúng hay không.
      await claimsRef.child(String(id)).set({ claimedBy: myName, claimedAt });
      showToast(`Đã khóa DATA #${String(id).padStart(6,'0')} cho ${myName}`, 'ok');
      const baseItem = rawPool.items.find(it => it.id === id);
      if (baseItem) syncToSheet({ ...baseItem, claimedBy: myName, claimedAt });
    } catch (e) {
      // Bị server từ chối (đã có người nhận trước) hoặc lỗi mạng — đọc lại xem ai đã nhận.
      try {
        const snap = await claimsRef.child(String(id)).once('value');
        const existing = snap.val();
        if (existing && existing.claimedBy) {
          showToast(`Chậm rồi — ${existing.claimedBy} lấy trước`, 'warn');
        } else {
          showToast('Có lỗi khi nhận data, kiểm tra mạng rồi thử lại', 'warn');
        }
      } catch (e2) {
        showToast('Có lỗi khi nhận data, kiểm tra mạng rồi thử lại', 'warn');
      }
    }
    return;
  }

  // Không có Firebase (chỉ chạy local) — giữ cách cũ, không có tranh chấp nhiều máy.
  const current = await loadPool();
  const idx = current.items.findIndex(it => it.id === id);
  if (idx === -1) return;
  if (current.items[idx].claimedBy) {
    state.pool = current;
    lastPoolSerialized = JSON.stringify(current);
    renderDynamic();
    showToast(`Chậm rồi — ${current.items[idx].claimedBy} lấy trước`, 'warn');
    return;
  }
  const todayStrLocal = new Date().toDateString();
  const claimedTodayLocal = current.items.filter(it =>
    it.claimedBy === myName && it.claimedAt && new Date(it.claimedAt).toDateString() === todayStrLocal
  ).length;
  if (claimedTodayLocal >= DAILY_CLAIM_LIMIT) {
    showToast(`Bạn đã nhận đủ ${DAILY_CLAIM_LIMIT} data hôm nay — không thể nhận thêm, thử lại vào ngày mai nhé.`, 'warn');
    return;
  }
  current.items[idx] = { ...current.items[idx], claimedBy: myName, claimedAt: Date.now() };
  await savePool(current);
  state.pool = current;
  lastPoolSerialized = JSON.stringify(current);
  renderDynamic();
  syncToSheet(current.items[idx]);
  showToast(`Đã khóa DATA #${String(id).padStart(6,'0')} cho ${myName}`, 'ok');
}

async function deleteItem(id) {
  const current = await loadPool();
  const itemBeingDeleted = current.items.find(it => it.id === id);
  const next = { nextId: current.nextId, items: current.items.filter(it => it.id !== id) };

  if (itemBeingDeleted && trashRef) {
    let claimData = null;
    if (claimsRef) {
      try {
        const snap = await claimsRef.child(String(id)).once('value');
        claimData = snap.val() || null;
      } catch (e) {}
    }
    trashRef.child(String(id)).set({
      item: itemBeingDeleted,
      claim: claimData,
      deletedBy: myCurrentName() || 'Không rõ',
      deletedAt: Date.now(),
    }).catch(() => {});
  }

  await savePool(next);
  if (claimsRef) claimsRef.child(String(id)).remove().catch(() => {});
  if (chatMetaRef) chatMetaRef.child(String(id)).remove().catch(() => {});
  rawPool = next;
  const merged = mergePoolWithClaims(rawPool, allClaims);
  state.pool = merged;
  lastPoolSerialized = JSON.stringify(merged);
  renderDynamic();
  showToast(`Đã xoá DATA #${String(id).padStart(6,'0')} — có thể khôi phục ở mục "Data đã xoá"`, 'ok');
}

async function restoreItem(id) {
  if (!trashRef) return;
  try {
    const snap = await trashRef.child(String(id)).once('value');
    const trashEntry = snap.val();
    if (!trashEntry || !trashEntry.item) { showToast('Không tìm thấy data để khôi phục', 'warn'); return; }

    const current = await loadPool();
    if (current.items.some(it => it.id === id)) {
      showToast('Data này đã tồn tại lại trong kho rồi', 'warn');
    } else {
      const next = { nextId: current.nextId, items: [trashEntry.item, ...current.items] };
      await savePool(next);
      rawPool = next;
    }

    if (trashEntry.claim && claimsRef) {
      claimsRef.child(String(id)).set(trashEntry.claim).catch(() => {});
    }
    trashRef.child(String(id)).remove().catch(() => {});

    const merged = mergePoolWithClaims(rawPool, allClaims);
    state.pool = merged;
    lastPoolSerialized = JSON.stringify(merged);
    renderDynamic();
    showToast(`Đã khôi phục DATA #${String(id).padStart(6,'0')}`, 'ok');
  } catch (e) {
    showToast('Khôi phục thất bại, kiểm tra mạng rồi thử lại', 'warn');
  }
}

function loadReadMap() {
  try { return JSON.parse(localStorage.getItem(CHAT_READ_KEY) || '{}'); } catch (e) { return {}; }
}
function saveReadMap(map) {
  try { localStorage.setItem(CHAT_READ_KEY, JSON.stringify(map)); } catch (e) {}
}
let chatReadMap = loadReadMap();
let chatMetaCache = {}; // itemId -> { lastTs, lastSender } — dữ liệu nhẹ, không kèm ảnh, chỉ để biết đơn nào có tin mới

let currentReadsListenerKey = null;

function markChatRead(itemId, nameOverride) {
  const ts = Date.now();
  chatReadMap[itemId] = ts;
  saveReadMap(chatReadMap);
  const myKey = pinKey(nameOverride || myCurrentName() || '');
  if (readsRef && myKey) {
    readsRef.child(myKey).child(String(itemId)).set(ts).catch(() => {});
  }
}

function attachReadsSyncForCurrentUser() {
  if (!readsRef) return;
  const myKey = pinKey(myCurrentName() || '');
  if (!myKey || myKey === currentReadsListenerKey) return;
  if (currentReadsListenerKey) readsRef.child(currentReadsListenerKey).off();
  currentReadsListenerKey = myKey;
  readsRef.child(myKey).on('value', (snap) => {
    const remote = snap.val() || {};
    let changed = false;
    Object.keys(remote).forEach(k => {
      if (!chatReadMap[k] || remote[k] > chatReadMap[k]) {
        chatReadMap[k] = remote[k];
        changed = true;
      }
    });
    if (changed) {
      saveReadMap(chatReadMap);
      if (state.lockedRole) renderDynamic();
    }
  });
}

function getUnreadCount(itemId) {
  const meta = chatMetaCache[itemId];
  if (!meta) return 0;
  const lastRead = chatReadMap[itemId] || 0;
  const me = myCurrentName();
  return (meta.lastTs > lastRead && meta.lastSender !== me) ? 1 : 0;
}

function getUnreadChatOrders() {
  const me = myCurrentName();
  const items = state.pool.items || [];
  let relevant;
  if (state.role === 'marketing') relevant = items.filter(it => it.sentBy === me);
  else if (state.role === 'sale') relevant = items.filter(it => it.claimedBy === me);
  else relevant = items.filter(it => it.claimedBy);
  return relevant
    .map(it => ({ item: it, count: getUnreadCount(it.id) }))
    .filter(x => x.count > 0)
    .sort((a, b) => b.count - a.count);
}

function renderUnreadOrdersBox(containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const list = getUnreadChatOrders();
  if (list.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div style="background:#0D1526;border:1px solid rgba(255,71,87,0.35);border-radius:10px;padding:10px 12px;margin-bottom:14px;">

let knownMetaState = {}; // itemId -> lastTs đã biết, để phát hiện cái gì thật sự mới
function checkChatMetaUpdate(meta) {
  const me = myCurrentName();
  const fresh = [];
  Object.keys(meta).forEach(itemId => {
    const m = meta[itemId];
    if (!m) return;
    const prevTs = knownMetaState[itemId] || 0;
    if (m.lastTs > prevTs && m.lastSender && m.lastSender !== me) {
      const item = findItemById(Number(itemId));
      if (item && isRelevantChatItem(item)) fresh.push({ item, meta: m });
    }
  });
  knownMetaState = Object.keys(meta).reduce((acc, k) => { acc[k] = meta[k].lastTs; return acc; }, {});
  if (fresh.length) {
    playBeep();
    const first = fresh[0];
    const body = fresh.length === 1
      ? `${first.meta.lastSender}: ${first.meta.lastPreview || '📷 đã gửi ảnh'}`
      : `${fresh.length} tin nhắn mới`;
    if (state.notifyEnabled && 'Notification' in window && Notification.permission === 'granted') {
      try {
        const n = new Notification('💬 Tin nhắn mới', { body });
        n.onclick = () => { window.focus(); n.close(); };
      } catch (e) {}
    } else {
      showToast(`💬 ${body}`, 'ok');
    }
    if (state.lockedRole) renderDynamic();
  }
}

      // Lần đầu tải trang: chỉ ghi nhớ mốc hiện tại, không báo "tin mới" hàng loạt.
      chatMetaPrimed = true;
      knownMetaState = Object.keys(chatMetaCache).reduce((acc, k) => { acc[k] = chatMetaCache[k].lastTs; return acc; }, {});
    } else {
      checkChatMetaUpdate(chatMetaCache);
    }
    if (state.lockedRole) renderDynamic();
  });
}

function nameColor(str) {
  let hash = 0;
  for (let i = 0; i < (str || '').length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 55%, 42%)`;
}

function avatarHtml(displayName, size) {
  size = size || 26;
  const key = pinKey(displayName || '');
  const url = allProfiles[key];

  }
  const initial = (displayName || '?').trim().charAt(0).toUpperCase() || '?';
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border-radius:50%;background:${nameColor(key)};color:#fff;font-size:${Math.round(size*0.45)}px;font-weight:700;flex-shrink:0;vertical-align:middle;">${initial}</span>`;
}

async function bulkAssignRole() {
  if (!pinsRef) { showToast('Cần bật kho dùng chung (Firebase)', 'warn'); return; }
  const textarea = document.getElementById('bulkAssignNames');
  const roleSelect = document.getElementById('bulkAssignRole');
  const raw = textarea ? textarea.value : '';
  const role = roleSelect ? roleSelect.value : 'sale';
  const names = raw.split(',').map(n => n.trim()).filter(Boolean);
  if (names.length === 0) { showToast('Dán danh sách tên trước đã', 'warn'); return; }

  const btn = document.getElementById('bulkAssignBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Đang gán…'; }

  let assigned = 0, skipped = 0;
  for (const name of names) {
    const key = pinKey(name);
    if (!key) { skipped++; continue; }
    try {
      const snap = await pinsRef.child(key).once('value');
      const existing = snap.val();
      if (existing === null) { skipped++; continue; }
      const existingPin = (existing && typeof existing === 'object') ? existing.pin : existing;
      await pinsRef.child(key).set({ pin: existingPin, role });
      assigned++;
    } catch (e) {
      skipped++;
    }
  }

  if (btn) { btn.disabled = false; btn.textContent = 'Gán vai trò'; }
  showToast(`Đã gán ${assigned} người vào ${role === 'marketing' ? 'Marketing' : 'Sale'}${skipped > 0 ? `, bỏ qua ${skipped} tên chưa từng đăng ký` : ''}`, 'ok');
}

function copyToClipboard(text) {
  if (!text) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('Đã copy: ' + text, 'ok')).catch(() => showToast('Copy thất bại', 'warn'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('Đã copy: ' + text, 'ok'); } catch (e) { showToast('Copy thất bại', 'warn'); }
    document.body.removeChild(ta);
  }
}

function todayIsoDate() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function paginate(items, page, pageSize) {
  const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
  const clampedPage = Math.min(Math.max(1, page), totalPages);
  const start = (clampedPage - 1) * pageSize;
  return { pageItems: items.slice(start, start + pageSize), totalPages, page: clampedPage, total: items.length };
}

function paginationHtml(prefix, page, totalPages, pageSize, total) {
  if (total === 0) return '';
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:12px;">
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#7C89A6;">
        Số dòng/trang:
        <select class="select" data-page-size="${prefix}" style="padding:4px 8px;">
          ${[10,25,50,100].map(n => `<option value="${n}" ${n===pageSize?'selected':''}>${n}</option>`).join('')}
        </select>
        <span>(${total} dòng)</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn ghost small" data-page-prev="${prefix}" ${page<=1?'disabled':''}>‹ Trước</button>
        <span style="font-size:12.5px;color:#7C89A6;">Trang ${page}/${totalPages}</span>
        <button class="btn ghost small" data-page-next="${prefix}" ${page>=totalPages?'disabled':''}>Sau ›</button>
      </div>
    </div>
  `;
}

let chatListenerItemId = null;
function openChat(item) {
  if (!chatsRef) {
    showToast('Cần bật kho dùng chung (Firebase) để dùng nhắn tin', 'warn');
    return;
  }
  if (!myCurrentName()) {
    showToast('Cần có tên để nhắn tin', 'warn');
    return;
  }
  if (chatListenerItemId !== null) {
    chatsRef.child(String(chatListenerItemId)).off();
  }
  state.chatItem = item;
  state.chatMessages = [];
  renderChatModal();
  markChatRead(item.id);
  renderDynamic();
  chatListenerItemId = item.id;
  chatsRef.child(String(item.id)).on('child_added', (snap) => {
    if (chatListenerItemId !== item.id) return;
    const msg = snap.val();
    if (!msg) return;
    state.chatMessages.push(msg);
    renderChatModal();
    markChatRead(item.id);
    renderDynamic();
  });
}

  if (chatListenerItemId !== null && chatsRef) {
    chatsRef.child(String(chatListenerItemId)).off();
  }
  chatListenerItemId = null;
  state.chatItem = null;
  state.chatMessages = [];
  state.pendingChatImage = null;
  document.getElementById('chatModalRoot').innerHTML = '';
}

async function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const text = input ? input.value.trim() : '';
  if (!text && !state.pendingChatImage) return;
  if (!state.chatItem) return;
  const me = myCurrentName();
  const itemId = state.chatItem.id;
  try {
    const payload = { sender: me, role: state.role, text: text || '', ts: Date.now() };
    if (state.pendingChatImage) payload.image = state.pendingChatImage;
    await chatsRef.child(String(itemId)).push(payload);
    if (chatMetaRef) {
      chatMetaRef.child(String(itemId)).set({
        lastTs: payload.ts,
        lastSender: me,
        lastPreview: text ? text.slice(0, 60) : '📷 đã gửi ảnh',
      }).catch(() => {});
    }
    if (input) input.value = '';
    state.pendingChatImage = null;
    renderChatModal();
  } catch (e) {
    showToast('Gửi tin nhắn thất bại, kiểm tra mạng', 'warn');
  }
}

function stageChatImage(file) {
  if (!file || !file.type.startsWith('image/') || !state.chatItem) return;
  const me = myCurrentName();
  if (!me) { showToast('Cần có tên để nhắn tin', 'warn'); return; }

function updateFilterOptions(items) {
  const sentBySelect = document.getElementById('filterSentBy');
  const claimedBySelect = document.getElementById('filterClaimedBy');
  if (sentBySelect) {
    const names = Array.from(new Set(items.map(i => i.sentBy).filter(Boolean))).sort();
    const prev = sentBySelect.value;
    sentBySelect.innerHTML = `<option value="">Tất cả Marketing</option>` + names.map(n => `<option value="${n}">${n}</option>`).join('');
    if (names.includes(prev)) sentBySelect.value = prev;
  }
  if (claimedBySelect) {
    const names = Array.from(new Set(items.map(i => i.claimedBy).filter(Boolean))).sort();
    const prev = claimedBySelect.value;
    claimedBySelect.innerHTML = `<option value="">Tất cả Sale</option>` + names.map(n => `<option value="${n}">${n}</option>`).join('');
    if (names.includes(prev)) claimedBySelect.value = prev;
  }
}

function getFilteredItems(items) {
  const search = (document.getElementById('filterSearch')?.value || '').trim().toLowerCase();
  const sentBy = document.getElementById('filterSentBy')?.value || '';
  const claimedBy = document.getElementById('filterClaimedBy')?.value || '';
  const status = document.getElementById('filterStatus')?.value || '';
  const from = document.getElementById('filterFrom')?.value || '';
  const to = document.getElementById('filterTo')?.value || '';
  return items.filter(it => {
    if (search && !((it.name || '').toLowerCase().includes(search) || (it.note || '').toLowerCase().includes(search))) return false;
    if (sentBy && it.sentBy !== sentBy) return false;
    if (claimedBy && it.claimedBy !== claimedBy) return false;
    if (status === 'pending' && it.claimedBy) return false;
    if (status === 'claimed' && !it.claimedBy) return false;
    if (from && it.createdAt < new Date(from + 'T00:00:00').getTime()) return false;
    if (to && it.createdAt > new Date(to + 'T23:59:59').getTime()) return false;
    return true;
  });
}

function clearAdminFilters() {
  ['filterSearch', 'filterFrom', 'filterTo'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  ['filterSentBy', 'filterClaimedBy', 'filterStatus'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  renderDynamic();
}

function renderStats(filteredItems) {
  const el = document.getElementById('statsSection');
  if (!el) return;
  const bySent = {}, byClaimed = {};
  filteredItems.forEach(it => {
    if (it.sentBy) bySent[it.sentBy] = (bySent[it.sentBy] || 0) + 1;
    if (it.claimedBy) byClaimed[it.claimedBy] = (byClaimed[it.claimedBy] || 0) + 1;
  });
  const sentRows = Object.entries(bySent).sort((a, b) => b[1] - a[1]);
  const claimedRows = Object.entries(byClaimed).sort((a, b) => b[1] - a[1]);
  const col = (title, rows) => `
    <div style="flex:1;min-width:220px;background:#0D1526;border-radius:10px;padding:12px 14px;">
      <div style="font-size:12.5px;color:#7C89A6;margin-bottom:8px;font-weight:600;">${title}</div>
      ${rows.length === 0 ? '<div class="empty small">Chưa có dữ liệu</div>' : rows.map(([name, count], i) => `
        <div style="display:flex;align-items:center;gap:8px;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.05);">
          <span style="display:flex;align-items:center;gap:8px;">${i + 1}. ${avatarHtml(name, 20)} ${name}</span><b>${count}</b>
        </div>
      `).join('')}
    </div>
  `;
  el.innerHTML = `
    <div style="display:flex;gap:16px;flex-wrap:wrap;">
      ${col('📣 Theo Marketing (đã gửi)', sentRows)}
      ${col('❤️ Theo Sale (đã nhận)', claimedRows)}
    </div>
  `;
}

function renderDynamic() {
  const items = state.pool.items;
  const pending = items.filter(i => !i.claimedBy).sort((a,b) => a.createdAt - b.createdAt);
  const claimed = items.filter(i => i.claimedBy).sort((a,b) => b.claimedAt - a.claimedAt);

  if (state.role === 'marketing') {
    renderUnreadOrdersBox('mktUnreadChats');
    const mine = items.filter(it => it.sentBy === state.mktName);
    const minePending = mine.filter(it => !it.claimedBy);
    const mineClaimed = mine.length - minePending.length;
    const pill = document.getElementById('pendingPill');
    if (pill) pill.textContent = `📡 ${minePending.length} đang chờ nhận`;

    const statsBar = document.getElementById('mktStatsBar');
    if (statsBar) {
      const todayStart = new Date(); todayStart.setHours(0,0,0,0);
      const mineToday = mine.filter(it => it.createdAt >= todayStart.getTime()).length;
      const mineWithQr = mine.filter(it => !!it.qrImage).length;
      const mineQrToday = mine.filter(it => it.createdAt >= todayStart.getTime() && !!it.qrImage).length;
      statsBar.innerHTML = `
        <div class="mkt-stat"><div class="n">${mine.length}</div><div class="l">Tổng data đã gửi</div></div>
        <div class="mkt-stat"><div class="n">${mineToday}</div><div class="l">Gửi hôm nay</div></div>
        <div class="mkt-stat"><div class="n" style="color:#FFC93C;">${minePending.length}</div><div class="l">Đang chờ nhận</div></div>
        <div class="mkt-stat"><div class="n" style="color:#35D07F;">${mineClaimed}</div><div class="l">Đã được khóa</div></div>
        <div class="mkt-stat"><div class="n" style="color:#7fb8ff;">${mineWithQr}</div><div class="l">Có ảnh QR</div></div>
        <div class="mkt-stat"><div class="n" style="color:#7fb8ff;">${mineQrToday}</div><div class="l">QR ảnh hôm nay</div></div>
      `;
    }

    const mSearch = (document.getElementById('mktFilterSearch')?.value || '').trim().toLowerCase();
    const mStatus = document.getElementById('mktFilterStatus')?.value || '';
    const mFrom = document.getElementById('mktFilterFrom')?.value || '';
    const mTo = document.getElementById('mktFilterTo')?.value || '';
    const mineFiltered = mine.filter(it => {
      if (mSearch && !((it.name || '').toLowerCase().includes(mSearch) || (it.note || '').toLowerCase().includes(mSearch))) return false;
      if (mStatus === 'pending' && it.claimedBy) return false;
      if (mStatus === 'claimed' && !it.claimedBy) return false;
      if (mFrom && it.createdAt < new Date(mFrom + 'T00:00:00').getTime()) return false;
      if (mTo && it.createdAt > new Date(mTo + 'T23:59:59').getTime()) return false;
      return true;
    });

    const logList = document.getElementById('logList');
    if (logList) {
      if (mineFiltered.length === 0) {
        logList.innerHTML = '<div class="empty small">Không có data khớp bộ lọc.</div>';
        const mktPaginationElEmpty = document.getElementById('mktPagination');
        if (mktPaginationElEmpty) mktPaginationElEmpty.innerHTML = '';
      } else {
        const sortedFiltered = mineFiltered.slice().sort((a, b) => b.createdAt - a.createdAt);
        const dayGroups = {};
        const dayKeys = [];
        sortedFiltered.forEach(it => {
          const d = new Date(it.createdAt);
          const key = d.toDateString();
          if (!dayGroups[key]) {
            dayGroups[key] = { label: d.toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' }), items: [] };
            dayKeys.push(key);
          }
          dayGroups[key].items.push(it);
        });
        const { pageItems: pageDayKeys, totalPages: mktTotalPages, page: mktPageNum, total: mktTotal } = paginate(dayKeys, state.mktDayPage, state.mktDaysPerPage);
        state.mktDayPage = mktPageNum;

          ${pageDayKeys.map(key => {
            const g = dayGroups[key];
            const gQrCount = g.items.filter(it => !!it.qrImage).length;

                <div style="font-size:12.5px;font-weight:650;color:#7C89A6;margin-bottom:6px;">📅 ${g.label} (${g.items.length} data · 🖼️ ${gQrCount} có QR)</div>

                  ${g.items.map(it => `
                    <div class="log-row">

                          const n = getUnreadCount(it.id);
                          return `<button class="chat-btn ${n > 0 ? 'has-unread' : ''}" data-chat="${it.id}">💬 Trao đổi${n > 0 ? `<span class="chat-badge">${n}</span>` : ''}</button>`;
                        })() : ''}

                      <span class="log-time">${formatTime(it.createdAt)}</span>
                    </div>

                </div>
              </div>

        `;
        const mktPaginationEl = document.getElementById('mktPagination');
        if (mktPaginationEl) {
          mktPaginationEl.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:8px;">
              <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#7C89A6;">
                Số ngày/trang:
                <select class="select" id="mktDaysPerPageSelect" style="padding:4px 8px;">
                  ${[1,3,5,7].map(n => `<option value="${n}" ${n===state.mktDaysPerPage?'selected':''}>${n}</option>`).join('')}
                </select>
                <span>(${mktTotal} ngày, ${mineFiltered.length} data)</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <button class="btn ghost small" data-mkt-day-prev ${mktPageNum<=1?'disabled':''}>‹ Trước</button>
                <span style="font-size:12.5px;color:#7C89A6;">Trang ${mktPageNum}/${mktTotalPages}</span>
                <button class="btn ghost small" data-mkt-day-next ${mktPageNum>=mktTotalPages?'disabled':''}>Sau ›</button>
              </div>
            </div>
          `;
        }
      }
    }
  } else if (state.role === 'sale') {
    renderUnreadOrdersBox('saleUnreadChats');
    const mineCard = (it, badgeText) => {
      const n = getUnreadCount(it.id);
      return `
        <div class="mine-compact">
          ${it.qrImage
            ? `<img class="card-qr-sm" src="${it.qrImage}" alt="QR khách" data-zoom-item="${it.id}" />`

          }
          <div class="mc-info">
            <div class="mc-name"><span class="mc-name-text">${it.name}</span> <span class="ticket">#${String(it.id).padStart(6,'0')}</span> <button class="copy-btn" data-copy-item="${it.id}" title="Copy">📋</button></div>
            <div class="mc-sub">${it.note ? it.note + ' · ' : ''}Nguồn: ${it.sentBy || 'không rõ'} · ${formatTime(it.claimedAt)}</div>
          </div>
          <div class="mc-right">
            ${it.zaloLink ? `<a class="zalo-btn" href="${it.zaloLink}" target="_blank" rel="noopener">💬 Zalo</a>` : ''}

          </div>
        </div>
      `;
    };

    const saleBody = document.getElementById('saleBody');
    if (saleBody) {
      saleBody.innerHTML = `
        ${pending.length === 0 ? '<div class="empty">Chưa có data mới. Chờ Marketing gửi vào nhé.</div>' : ''}
        <div class="grid">
          ${pending.map(it => {
            const isNew = Date.now() - it.createdAt < 6000;
            return `
              <div class="card ${isNew ? 'pulse' : ''}">
                <div class="card-top">
                  <span class="ticket">#${String(it.id).padStart(6,'0')}</span>
                  <span class="time">🕐 ${formatTime(it.createdAt)}</span>
                </div>
                <div class="card-body">
                  ${it.qrImage
                    ? `<img class="card-qr" src="${it.qrImage}" alt="QR khách" data-zoom-item="${it.id}" />`
                    : `<div class="card-qr" style="display:flex;align-items:center;justify-content:center;color:#556;font-size:11px;text-align:center;">Chưa có ảnh QR</div>`
                  }
                  <div class="card-info">
                    <div class="card-name">${it.name}</div>
                    ${it.note ? `<div class="card-note">${it.note}</div>` : ''}
                  </div>
                </div>
                <button class="heart-btn" data-claim="${it.id}">❤️ Nhận data</button>
              </div>
            `;
          }).join('')}
        </div>
        ${(() => {
          const mineClaimed = claimed.filter(it => it.claimedBy === state.saleName).sort((a, b) => b.claimedAt - a.claimedAt);
          if (mineClaimed.length === 0) return '';
          const dayGroups = {};
          const dayKeys = [];
          mineClaimed.forEach(it => {
            const d = new Date(it.claimedAt);
            const key = d.toDateString();
            if (!dayGroups[key]) {
              dayGroups[key] = { label: d.toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' }), items: [] };
              dayKeys.push(key);
            }
            dayGroups[key].items.push(it);
          });
          const { pageItems: pageDayKeys, totalPages, page, total } = paginate(dayKeys, state.saleDayPage, state.saleDaysPerPage);
          state.saleDayPage = page;
          return `
            <h3 class="sub-head">Đã khóa (của bạn) — ${mineClaimed.length} data</h3>
            ${pageDayKeys.map(key => {
              const g = dayGroups[key];
              return `
                <div style="margin-bottom:14px;">
                  <div style="font-size:12.5px;font-weight:650;color:#7C89A6;margin-bottom:6px;">📅 ${g.label} (${g.items.length} data)</div>
                  <div class="locked-list" style="gap:10px;">
                    ${g.items.map(it => mineCard(it, '✔ Bạn đã nhận data này')).join('')}
                  </div>
                </div>
              `;
            }).join('')}
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:8px;">
              <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#7C89A6;">
                Số ngày/trang:
                <select class="select" id="saleDaysPerPageSelect" style="padding:4px 8px;">
                  ${[1,3,5,7].map(n => `<option value="${n}" ${n===state.saleDaysPerPage?'selected':''}>${n}</option>`).join('')}
                </select>
                <span>(${total} ngày)</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <button class="btn ghost small" data-sale-day-prev ${page<=1?'disabled':''}>‹ Trước</button>
                <span style="font-size:12.5px;color:#7C89A6;">Trang ${page}/${totalPages}</span>
                <button class="btn ghost small" data-sale-day-next ${page>=totalPages?'disabled':''}>Sau ›</button>
              </div>
            </div>
          `;
        })()}
      `;
    }

    const searchInput = document.getElementById('saleSearchInput');
    const searchResults = document.getElementById('saleSearchResults');
    if (searchResults) {
      const q = (searchInput && searchInput.value.trim().toLowerCase()) || '';
      const sFrom = document.getElementById('saleFilterFrom')?.value || '';
      const sTo = document.getElementById('saleFilterTo')?.value || '';
      if (!q && !sFrom && !sTo) {
        searchResults.innerHTML = '<div class="empty small">Gõ tên khách/SĐT hoặc chọn khoảng ngày để tìm trong toàn bộ data bạn đã từng nhận.</div>';
      } else {
        const mine = items.filter(it => {
          if (it.claimedBy !== state.saleName) return false;
          if (q && !((it.name || '').toLowerCase().includes(q) || (it.note || '').toLowerCase().includes(q))) return false;
          if (sFrom && it.claimedAt < new Date(sFrom + 'T00:00:00').getTime()) return false;
          if (sTo && it.claimedAt > new Date(sTo + 'T23:59:59').getTime()) return false;
          return true;
        }).sort((a, b) => b.claimedAt - a.claimedAt);
        if (mine.length === 0) {
          searchResults.innerHTML = '<div class="empty small">Không tìm thấy data nào khớp trong lịch sử của bạn.</div>';
        } else {
          const { pageItems: salePageItems, totalPages: saleTotalPages, page: salePageNum, total: saleTotal } = paginate(mine, state.salePage, state.salePageSize);
          state.salePage = salePageNum;
          searchResults.innerHTML = `<div class="locked-list" style="gap:10px;">${salePageItems.map(it => mineCard(it, '✔ Data bạn đã nhận trước đây')).join('')}</div>${paginationHtml('sale', salePageNum, saleTotalPages, state.salePageSize, saleTotal)}`;
        }
      }
    }
  } else if (state.role === 'admin') {
    renderSyncBanner();
    renderPinsSection();
    renderTrashSection();
    renderRoleChangeLog();
    updateFilterOptions(items);
    const filtered = getFilteredItems(items);
    renderStats(filtered);
    const table = document.getElementById('adminTable');
    if (table) {
      const { pageItems, totalPages, page, total } = paginate(filtered, state.adminPage, state.adminPageSize);
      state.adminPage = page;
      const startIdx = (page - 1) * state.adminPageSize;
      table.innerHTML = `
        <div class="table-head">
          <span>STT</span><span>Ảnh</span><span>Mã data</span><span>Khách</span><span>Nguồn data</span><span>Người gửi</span><span>Trạng thái</span><span>Người nhận</span><span>Giờ gửi</span><span>Giờ nhận</span><span></span>
        </div>
        ${filtered.length === 0 ? '<div class="empty small">Không có dữ liệu khớp bộ lọc.</div>' : ''}
        ${pageItems.map((it, idx) => `
          <div class="table-row">
            <span class="muted">${startIdx + idx + 1}</span>
            ${qrThumb(it, 'table-thumb')}
            <span class="ticket">#${String(it.id).padStart(6,'0')}</span>
            ${tableCell(it.name)}
            ${tableCell(it.note, 'muted')}
            <span class="muted" style="display:flex;align-items:center;gap:6px;">${it.sentBy ? avatarHtml(it.sentBy, 18) : ''}${it.sentBy || '—'}</span>
            <span class="${it.claimedBy ? 'status locked' : 'status pending'}">${it.claimedBy ? '✔ Đã khóa' : 'Đang chờ'}</span>
            <span style="display:flex;align-items:center;gap:6px;">${it.claimedBy ? avatarHtml(it.claimedBy, 18) : ''}${it.claimedBy || '—'}</span>
            <span class="muted">${formatTime(it.createdAt)}</span>
            <span class="muted">${formatTime(it.claimedAt)}</span>
            <div style="display:flex;gap:4px;">
              ${it.claimedBy ? (() => {
                const n = getUnreadCount(it.id);
                return `<button class="chat-btn ${n > 0 ? 'has-unread' : ''}" style="padding:6px 8px;" data-chat="${it.id}" title="Xem trao đổi">💬${n > 0 ? `<span class="chat-badge">${n}</span>` : ''}</button>`;
              })() : ''}
              <button class="row-delete-btn" data-delete="${it.id}" title="Xoá data này">✕</button>
            </div>
          </div>
        `).join('')}
      `;
      const paginationEl = document.getElementById('adminPagination');
      if (paginationEl) paginationEl.innerHTML = paginationHtml('admin', page, totalPages, state.adminPageSize, total);
    }
  }
}

// Realtime updates when Firebase is on; polling fallback (same-browser tabs) when it's off.
if (dbRef) {
  dbRef.on('value', (snap) => {
    rawPool = normalizePool(snap.val());
    recomputeMergedPool();
  }, (err) => {
    if (!remoteWarned) {
      showToast('Mất kết nối kho dùng chung — kiểm tra mạng', 'warn');
      remoteWarned = true;
    }
  });
  if (claimsRef) {
    claimsRef.on('value', (snap) => {
      allClaims = snap.val() || {};
      recomputeMergedPool();
    });
  }
} else {
  setInterval(async () => {
    const fresh = loadLocalCache();
    const serialized = JSON.stringify(fresh);
    if (serialized !== lastPoolSerialized) {
      state.pool = fresh;
      lastPoolSerialized = serialized;
      checkForNewItems(fresh);
      if (state.lockedRole) renderDynamic();
    }
  }, 2000);
  window.addEventListener('storage', (e) => {
    if (e.key === LOCAL_POOL_CACHE_KEY) {
      state.pool = loadLocalCache();
      lastPoolSerialized = JSON.stringify(state.pool);
      checkForNewItems(state.pool);
      if (state.lockedRole) renderDynamic();
    }
  });
}

document.getElementById('app').addEventListener('click', async (e) => {
  const pickBtn = e.target.closest('[data-pick]');
  if (pickBtn) { state.gatePick = pickBtn.dataset.pick; state.gateError = ''; renderGate(); return; }
  if (e.target.closest('#gateBackBtn')) { state.gatePick = null; state.gateError = ''; renderGate(); return; }
  if (e.target.closest('#gateConfirmBtn')) {
    const input = document.getElementById('gateCodeInput');
    const val = input ? input.value : '';
    if (val === ROLE_CODES[state.gatePick]) {
      unlockRole(state.gatePick);
    } else {
      state.gateError = 'Mã không đúng, thử lại.';
      renderGate();
    }
    return;
  }
  if (e.target.closest('#relockBtn')) { relockDevice(); return; }
  if (e.target.closest('#hardRefreshBtn')) {
    const url = new URL(window.location.href);
    url.searchParams.set('v', Date.now());
    window.location.href = url.toString();
    return;
  }
  if (e.target.closest('#groupChatBtn')) { openGroupChat(); return; }
  if (e.target.id === 'groupChatOverlay') { closeGroupChat(); return; }
  if (e.target.closest('#groupChatCloseBtn')) { closeGroupChat(); return; }

    state.groupNotifyEnabled = !state.groupNotifyEnabled;

    renderGroupChatModal();

  }
  if (e.target.closest('#groupChatSendBtn')) { sendGroupChatMessage(); return; }
  if (e.target.closest('#groupChatImageBtn')) { document.getElementById('groupChatImageInput').click(); return; }
  if (e.target.closest('#groupChatCancelImageBtn')) { state.pendingGroupChatImage = null; renderGroupChatModal(); return; }
  const zoomGroupMsg = e.target.closest('[data-zoom-group-msg]');
  if (zoomGroupMsg) {
    const mi = Number(zoomGroupMsg.dataset.zoomGroupMsg);
    const msg = state.groupChatMessages[mi];
    if (msg && msg.image) openLightbox(msg.image);
    return;
  }
  if (e.target.closest('#saleSearchToggleBtn')) {
    const wrap = document.getElementById('saleSearchWrap');
    const btn = document.getElementById('saleSearchToggleBtn');
    if (wrap && btn) {
      const isOpen = wrap.style.display !== 'none';
      wrap.style.display = isOpen ? 'none' : 'block';
      btn.textContent = isOpen ? '🔍 Tra lại data đã chốt ▾' : '🔍 Tra lại data đã chốt ▴';
    }
    return;
  }

  const roleTab = e.target.closest('[data-role]');
  if (roleTab) {
    state.role = roleTab.dataset.role;
    // Admin dùng luôn tên/PIN đã đăng ký để có đủ chức năng ngay ở tab khác, khỏi đăng ký lại.
    if (state.lockedRole === 'admin' && state.adminName) {
      if (state.role === 'marketing' && !state.mktName) state.mktName = state.adminName;
      if (state.role === 'sale' && !state.saleName) state.saleName = state.adminName;
    }
    renderShell();
    renderNav();
    return;
  }

  if (e.target.closest('#clearImgBtn')) {
    state.pendingImage = null;
    state.pendingZaloLink = null;

    return;

  if (e.target.closest('#chooseFileBtn')) {
    document.getElementById('fileInput').click();

    avatarPickContext = avatarPick.dataset.avatarPick;

    return;

    if (btn) { btn.disabled = true; btn.textContent = 'Đang kiểm tra…'; }

    if (res.registered) showToast('Đã đăng ký PIN cho tên này — nhớ để dùng máy khác', 'ok');
    if (state.pendingAvatar && profilesRef) {
